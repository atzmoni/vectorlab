services:
  vectorlab:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Signed download URLs are HMAC'd with this value. Leaving it unset falls
      # back to the placeholder committed in app/config.py, which is public —
      # set a real secret before exposing the service.
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:?set a random secret, e.g. openssl rand -hex 32}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      DOWNLOAD_TTL_SECONDS: ${DOWNLOAD_TTL_SECONDS:-3600}
    volumes:
      # Outputs are written on vectorize and read back on download, so this has
      # to outlive a single request and survive restarts.
      - vectorlab-output:/data
    restart: unless-stopped

volumes:
  vectorlab-output:
